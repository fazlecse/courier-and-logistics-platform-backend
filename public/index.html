<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courier & Logistics Platform API</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 1rem;
      border: 1px solid #334155;
      text-align: center;
      max-width: 480px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
    }
    h1 { margin-top: 0; font-size: 1.5rem; color: #38bdf8; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: #065f46;
      color: #34d399;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    a { color: #38bdf8; text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">● API System Active</div>
    <h1>Courier & Logistics Platform 🚚</h1>
    <p>Backend API services are running healthy and ready to process logistics, parcel tracking, and secure Stripe transactions.</p>
    <p><a href="/health">Check Health Status (/health)</a></p>
  </div>
</body>
</html>
